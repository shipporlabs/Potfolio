name: potfolio
description: Potfolio — build a portfolio, not a guess. AI-assisted stock pots on Base.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  provider: ^6.1.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  fl_chart: ^0.69.0
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  web3dart: ^2.7.3
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/data/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FBF6EE"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true
