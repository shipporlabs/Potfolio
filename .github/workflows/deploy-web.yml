name: Deploy website

# Builds the landing page (site/), the Flutter web app (/app/) and, if no APK
# is committed at site/download/potfolio.apk, an arm64 APK. Then deploys to
# Firebase Hosting (https://usepotfolio.web.app).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  WORKER_URL: ${{ vars.WORKER_URL || 'https://potfolio-api.purpose-money-api.workers.dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build site
        run: BUILD_APK=1 bash scripts/build_site.sh

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_USEPOTFOLIO }}
          projectId: usepotfolio
          channelId: live
